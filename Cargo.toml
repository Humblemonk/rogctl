[package]
name = "rogctl"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "rogctl - Battery status and settings for ASUS mice on Linux"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Humblemonk/rogctl"
keywords = ["asus", "rog", "mouse", "battery", "hidraw"]
categories = ["command-line-utilities", "hardware-support", "os::linux-apis"]

[dependencies]
libc = "0.2.189"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
